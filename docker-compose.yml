services:

  postgres:
    image: postgres:17
    container_name: personal-agent-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: personal_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agent -d personal_agent"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: